name: Resurrection QA

# How this workflow spends time (R4):
#   push                    quick checks only (about 3 minutes): npm test, the Node shell in English, the guide audit,
#                           the preview-save check. Documents, reports, releases and screenshots do not start a run at all.
#   push with [ci r4]       also the real-Chromium prologue / beam / chase / train / chain / epilogue checks, in parallel
#   push with [ci full]     everything below, once, for a frozen version
#   workflow_dispatch       suite = quick | r4 | full (full ignores a result already recorded for the same game files
#                           unless "force" is ticked)
#   pull_request            everything
# A newer push cancels the older push run on the same branch; a manual run is only cancelled by a newer manual run.
# The full result of a given set of game files is recorded (job "record") and reused, so repackaging, new reports and
# new documents never repeat the whole-game tests.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'release/**'
      - 'test-runs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'quick = Node tests and the Node shell; r4 = + the real-Chromium R4 checks; full = everything'
        type: choice
        options: [quick, r4, full]
        default: quick
      force:
        description: 'Run the full suite even if this exact game version already passed it'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # the record of a passed full run is kept in the Actions cache

concurrency:
  group: qa-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (what this run needs, and whether this game version already passed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      full: ${{ steps.reuse.outputs.full }}
      r4: ${{ steps.reuse.outputs.r4 }}
      p5: ${{ steps.areas.outputs.p5 }}
      server: ${{ steps.areas.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope of this run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.suite }}
        run: |
          msg=$(git log -1 --format=%B "$GITHUB_SHA")
          scope=quick
          if [ "$EVENT" = "workflow_dispatch" ]; then scope="$INPUT"
          elif [ "$EVENT" = "pull_request" ]; then scope=full
          elif echo "$msg" | grep -q '\[ci full\]'; then scope=full
          elif echo "$msg" | grep -q '\[ci r4\]'; then scope=r4
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"; echo "scope: $scope"

      - name: Fingerprint of the game files (reports, docs, releases and screenshots are not part of it)
        id: hash
        run: |
          h=$(git ls-files -s -- frontend combined-server backend/src shared test e2e playwright.config.js package.json package-lock.json Dockerfile \
                tools/v5-shell-run.mjs tools/v5-three-shim.mjs tools/v5-playthrough.mjs tools/v5-bundle.mjs tools/v5-serve.mjs tools/v5-guide-audit.mjs tools/v5-preview-saves.mjs tools/r4-browser.mjs \
                ':(exclude)frontend/v5/rc' | sha256sum | cut -c1-24)
          echo "hash=$h" >> "$GITHUB_OUTPUT"; echo "game fingerprint: $h"

      - name: A full pass already recorded for this fingerprint?
        id: recorded
        uses: actions/cache/restore@v4
        with:
          path: .full-pass
          key: full-pass-${{ steps.hash.outputs.hash }}

      - name: Decide
        id: reuse
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          HIT: ${{ steps.recorded.outputs.cache-hit }}
          FORCE: ${{ inputs.force }}
        run: |
          full=false; r4=false
          if [ "$SCOPE" = "full" ]; then
            if [ "$HIT" = "true" ] && [ "$FORCE" != "true" ]; then
              echo "::notice::This game version already passed the full suite; reusing it: $(cat .full-pass/info.txt)"
            else full=true; r4=true; fi
          elif [ "$SCOPE" = "r4" ]; then r4=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"; echo "r4=$r4" >> "$GITHUB_OUTPUT"; echo "full=$full r4=$r4"

      - name: Which old areas does this branch touch (compared with master)?
        id: areas
        run: |
          base=$(git merge-base "$GITHUB_SHA" origin/master 2>/dev/null || true)
          p5=true; server=true
          if [ -n "$base" ]; then
            git diff --name-only "$base" "$GITHUB_SHA" > changed.txt
            grep -Eq '^(frontend/p5/|e2e/p5\.spec\.js|combined-server/|test/p5-)' changed.txt || p5=false
            grep -Eq '^(Dockerfile|combined-server/|backend/|deploy/)' changed.txt || server=false
          fi
          # the P5 slice is old code with a known failing baseline (docs/V5-P5-BASELINE.md): it only runs when this branch touches it
          echo "p5=$p5" >> "$GITHUB_OUTPUT"; echo "server=$server" >> "$GITHUB_OUTPUT"; echo "p5=$p5 server=$server"

  quick:
    name: Quick checks (npm test, Node shell EN, guide audit, preview saves)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm test
        run: npm test
      - name: Swallowed-comment lint
        run: node tools/v5-lint-swallowed.mjs
      - name: Preview saves match the code
        run: node tools/v5-preview-saves.mjs --check
      - name: Guide audit
        run: node tools/v5-guide-audit.mjs && node tools/v5-guide-audit.mjs --alt
      - name: The real main.js in the Node shell, whole game in English
        run: node tools/v5-shell-run.mjs --quiet

  r4-browser:
    name: R4 real-Chromium checks (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.r4 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: prologue EN, checks: prologue }
          - { name: prologue ZH, checks: prologue-zh }
          - { name: 'chase, train, beams, chain, epilogue', checks: 'chase train beam town-beam chain epilogue' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - name: Play with the real keyboard
        run: node tools/r4-browser.mjs ${{ matrix.checks }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-browser-${{ strategy.job-index }}
          path: docs/r4-evidence/browser/
          retention-days: 30

  v5-main:
    name: V5 ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'whole game EN (prologue, 7 chapters, epilogue)', minutes: 75, grep: 'epilogue, en$', invert: '' }
          - { name: 'whole game ZH (prologue, 7 chapters, epilogue)', minutes: 75, grep: 'epilogue, zh$', invert: '' }
          - { name: 'every beat, Tab, remap, touch, pad and keyboard menus, audio, tech', minutes: 50, grep: '', invert: 'device: |whole game: prologue' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - name: Node shell, all modes
        if: matrix.grep == ''
        run: npm run test:v5-shell
      - name: Build the V5 playtest package
        if: matrix.grep == ''
        run: node tools/v5-playtest-pack.mjs
      - name: Chromium
        env:
          GREP: ${{ matrix.grep }}
          INVERT: ${{ matrix.invert }}
        run: |
          if [ -n "$GREP" ]; then npx playwright test e2e/v5.spec.js --grep "$GREP"
          else npx playwright test e2e/v5.spec.js --grep-invert "$INVERT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-main-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  v5-devices:
    name: V5 whole game on one input device (${{ matrix.device }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: kbm, minutes: 65 }
          - { device: pad, minutes: 45 }
          - { device: touch, minutes: 45 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - name: Device path in the Node shell (fast check)
        run: node tools/v5-shell-run.mjs --quiet --device ${{ matrix.device }}
      - name: Whole game in Chromium with only this device
        run: |
          npx playwright test e2e/v5.spec.js --grep "device: ${{ matrix.device }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-device-${{ matrix.device }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  v5-rc:
    name: V5 review pages, first-time guide and packages (${{ matrix.spec }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        spec: [v5-rc, v5-rc2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - name: Build the review package and the playtest package (single html files)
        if: matrix.spec == 'v5-rc'
        run: npm run v5:rc
      - name: Chromium
        run: npx playwright test e2e/${{ matrix.spec }}.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-rc-${{ matrix.spec }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  browser-old:
    name: Older pages and the old game (Playwright), once per frozen version
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - name: Run browser suite (all but P5 and V5)
        run: npm run test:e2e
        env:
          E2E_SKIP_P5: '1'
          E2E_SKIP_V5: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-old
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  browser-p5:
    name: P5 slice (Playwright), only when this branch touches it
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.p5 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/browser
      - run: npx playwright test e2e/p5.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-p5
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Container smoke (build, health, restart recovery, no tokens in logs)
    needs: plan
    if: needs.plan.outputs.full == 'true' || (github.event_name == 'push' && needs.plan.outputs.server == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t resurrection:ci .

      - name: Confirm the image runs as the unprivileged user
        run: test "$(docker image inspect resurrection:ci --format '{{.Config.User}}')" = "node"

      - name: Start with a persistent save volume (read-only root, no capabilities)
        run: |
          docker volume create resurrection-ci-saves
          docker run -d --name game -p 3000:3000 \
            -v resurrection-ci-saves:/data \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            resurrection:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/api/health

      - name: Create a session and advance it
        run: |
          SID=$(curl -fsS -X POST http://127.0.0.1:3000/api/sessions | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).sessionId))")
          echo "SID=$SID" >> "$GITHUB_ENV"
          curl -fsS -X POST "http://127.0.0.1:3000/api/sessions/$SID/actions" -H 'content-type: application/json' \
            -d '{"actionId":"ci-open-1","expectedRevision":0,"type":"OPEN_THREAD","payload":{}}' | grep -q '"revision":1'

      - name: Restart the container and recover the session from the volume
        run: |
          docker restart game
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fsS "http://127.0.0.1:3000/api/sessions/$SID" | grep -q '"revision":1'

      - name: Logs carry no session tokens or save paths
        run: |
          if docker logs game 2>&1 | grep -Eq '[a-f0-9]{64}|/data/'; then
            echo "Sensitive value found in container logs"; docker logs game; exit 1
          fi

      - name: Stop and remove the container
        if: always()
        run: |
          docker rm -f game || true
          docker volume rm resurrection-ci-saves || true

  record:
    name: Record the full pass for this game version (so it is not run again)
    needs: [plan, quick, r4-browser, v5-main, v5-devices, v5-rc, browser-old, browser-p5, container]
    if: ${{ !cancelled() && needs.plan.outputs.full == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fingerprint
        id: hash
        run: |
          h=$(git ls-files -s -- frontend combined-server backend/src shared test e2e playwright.config.js package.json package-lock.json Dockerfile \
                tools/v5-shell-run.mjs tools/v5-three-shim.mjs tools/v5-playthrough.mjs tools/v5-bundle.mjs tools/v5-serve.mjs tools/v5-guide-audit.mjs tools/v5-preview-saves.mjs tools/r4-browser.mjs \
                ':(exclude)frontend/v5/rc' | sha256sum | cut -c1-24)
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          mkdir .full-pass; echo "run $GITHUB_RUN_ID, commit $GITHUB_SHA, ${{ github.server_url }}/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID" > .full-pass/info.txt
      - uses: actions/cache/save@v4
        with:
          path: .full-pass
          key: full-pass-${{ steps.hash.outputs.hash }}
