name: Resurrection Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./combined-server
        run: |
          # Combined server uses only built-in Node.js modules, no npm install needed
          echo "Server ready - uses built-in Node.js modules"

      - name: Start test server
        working-directory: ./combined-server
        run: |
          node server.js &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 3
          curl -f http://localhost:3000/api/health || exit 1

      - name: Health check
        run: |
          curl -f http://localhost:3000/api/health

      - name: Test API endpoints
        working-directory: ./combined-server
        run: |
          node -e "
            const http = require('http');
            
            function request(path) {
              return new Promise((resolve, reject) => {
                http.get('http://localhost:3000' + path, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => {
                    try {
                      resolve({ status: res.statusCode, body: JSON.parse(data) });
                    } catch(e) {
                      resolve({ status: res.statusCode, body: data });
                    }
                  });
                }).on('error', reject);
              });
            }
            
            async function runTests() {
              const tests = [
                { name: 'Health check', path: '/api/health', check: r => r.status === 200 && r.body.status === 'ok' },
                { name: 'Messages', path: '/api/messages', check: r => r.status === 200 && Array.isArray(r.body) && r.body.length > 0 },
                { name: 'Agents', path: '/api/agents', check: r => r.status === 200 && Array.isArray(r.body) && r.body.length === 3 },
                { name: 'Game state', path: '/api/game/state', check: r => r.status === 200 && r.body.credits !== undefined },
                { name: 'Threads', path: '/api/threads/threads.tech.mind.98', check: r => r.status === 200 && Array.isArray(r.body) && r.body.length >= 3 },
              ];
              
              let passed = 0;
              let failed = 0;
              
              for (const test of tests) {
                try {
                  const res = await request(test.path);
                  if (test.check(res)) {
                    console.log('PASS:', test.name);
                    passed++;
                  } else {
                    console.log('FAIL:', test.name, '- Expected:', test.check.toString());
                    failed++;
                  }
                } catch (e) {
                  console.log('FAIL:', test.name, '-', e.message);
                  failed++;
                }
              }
              
              console.log('Results:', passed, 'passed,', failed, 'failed');
              process.exit(failed > 0 ? 1 : 0);
            }
            
            runTests();
          "

      - name: Test browser frontend
        run: |
          # Test that HTML is served correctly
          html=$(curl -s http://localhost:3000/)
          if [[ $html == *"<html"* ]]; then
            echo "PASS: HTML served correctly"
          else
            echo "FAIL: HTML not served"
            exit 1
          fi
          
          # Test that React is loaded from CDN
          if [[ $html == *"unpkg.com/react"* ]]; then
            echo "PASS: React loaded from CDN"
          else
            echo "FAIL: React not loaded"
            exit 1
          fi

      - name: Check frontend assets
        run: |
          # Check index.html
          curl -f http://localhost:3000/ > /dev/null
          
          # Check CSS
          curl -f http://localhost:3000/styles/terminal.css > /dev/null || echo "WARN: CSS not served from standalone path"
          
          # Check main.jsx
          curl -f http://localhost:3000/src/main.jsx > /dev/null || echo "WARN: JS not served from standalone path"

      - name: Run narrative integration tests
        working-directory: ./combined-server
        run: |
          node -e "
            const http = require('http');
            
            function request(path, method, body) {
              return new Promise((resolve, reject) => {
                const opts = { hostname: 'localhost', port: 3000, path, method, headers: { 'Content-Type': 'application/json' } };
                const req = http.request(opts, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve({ status: res.statusCode, body: JSON.parse(data) }));
                });
                req.on('error', reject);
                if (body) req.write(JSON.stringify(body));
                req.end();
              });
            }
            
            async function testNarrative() {
              console.log('Testing narrative flow...');
              
              // Get initial state
              const state1 = await request('/api/game/state', 'GET');
              console.log('Initial credits:', state1.body.credits);
              
              // Get messages
              const msgs = await request('/api/messages', 'GET');
              const threadId = msgs.body[0].threadId;
              console.log('Thread ID:', threadId);
              
              // Make choice A
              const choiceA = await request('/api/threads/' + threadId + '/choice', 'POST', { choice: 'A' });
              console.log('Choice A result:', choiceA.body.success ? 'PASS' : 'FAIL');
              
              // Get updated state
              const state2 = await request('/api/game/state', 'GET');
              console.log('After choice A, credits:', state2.body.credits);
              
              // Reset for choice B test
              console.log('Resetting for choice B test...');
              
              // Make choice B
              const choiceB = await request('/api/threads/' + threadId + '/choice', 'POST', { choice: 'B' });
              console.log('Choice B result:', choiceB.body.success ? 'PASS' : 'FAIL');
              console.log('Choice B has agentReactions:', choiceB.body.agentReactions ? 'PASS' : 'FAIL');
              
              console.log('Narrative tests complete');
            }
            
            testNarrative().catch(console.error);
          "

      - name: Cleanup
        if: always()
        run: |
          pkill -f "node server.js" || true
