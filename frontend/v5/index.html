<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resurrection — The Summer We Never Finished</title>
  <style>
    :root { --ink:#fff6ea; --dim:rgba(255,246,234,.7); --gold:#ffd27a; --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; --mono:"Courier New", "Noto Sans Mono CJK SC", monospace;
      --shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.55), 0 2px 18px rgba(20,10,30,.45); }
    * { box-sizing:border-box; } [hidden] { display:none !important; }
    html, body { margin:0; height:100%; background:#0b0812; color:var(--ink); font-family:var(--font); overflow:hidden; }
    #app { position:fixed; inset:0; }
    #stage, #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
    #stage { transition:filter .3s; }
    #app.shift #stage { filter:brightness(1.5) saturate(.5) blur(2px); }
    .vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 60%, rgba(10,6,20,.45) 100%); transition:background .6s; }
    #app.cine .vignette { background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(10,6,20,.7) 100%); }
    button { font-family:var(--font); } button:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }

    .meter { position:absolute; z-index:6; left:50%; bottom:22%; transform:translateX(-50%); width:min(420px, 80vw); text-align:center; color:var(--ink); text-shadow:var(--shadow); }
    .meter .dial { position:relative; height:16px; border-radius:8px; background:rgba(20,14,30,.55); border:1px solid rgba(255,246,234,.5); }
    .meter .mid { position:absolute; left:40%; width:20%; top:0; bottom:0; background:rgba(255,210,122,.25); border-radius:6px; } .meter .mid.in { background:rgba(155,227,155,.55); }
    .meter .needle { position:absolute; top:-6px; width:3px; height:28px; margin-left:-1px; background:var(--gold); box-shadow:0 0 8px var(--gold); }
    .meter .strings { margin-top:8px; letter-spacing:.3em; font-size:.9rem; }
    .paper { position:absolute; z-index:6; left:50%; top:46%; transform:translate(-50%, -50%) rotate(-1.5deg); width:min(520px, 86vw); height:auto; border-radius:4px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
    .reticle { position:absolute; z-index:5; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; border:1.5px solid rgba(255,246,234,.7); border-radius:50%; transition:transform .2s, border-color .2s; pointer-events:none; }
    .reticle.on { transform:scale(1.6); border-color:var(--gold); }
    .act { position:absolute; z-index:6; left:50%; bottom:max(96px, calc(env(safe-area-inset-bottom) + 80px)); transform:translateX(-50%); color:var(--dim); font-size:.85rem; letter-spacing:.06em; text-shadow:var(--shadow); opacity:0; transition:opacity .4s; pointer-events:none; white-space:nowrap; }
    .act.on { opacity:.95; }
    #app.cine .act { opacity:0; }
    /* almost no HUD: a chapter marker that fades, a prompt only in reach, subtitles, and choices when asked */
    .chapter { position:absolute; z-index:6; top:max(18px, env(safe-area-inset-top)); left:max(22px, env(safe-area-inset-left)); font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); text-shadow:var(--shadow); opacity:0; transition:opacity 1.2s; pointer-events:none; }
    .chapter.on { opacity:.95; }
    .era { position:absolute; z-index:6; top:max(16px, env(safe-area-inset-top)); right:max(18px, env(safe-area-inset-right)); background:transparent; border:0; color:var(--dim); font-size:.78rem; letter-spacing:.08em; text-shadow:var(--shadow); cursor:pointer; }
    .source { position:absolute; z-index:6; top:max(38px, calc(env(safe-area-inset-top) + 22px)); right:max(18px, env(safe-area-inset-right)); background:transparent; border:0; color:rgba(191,232,255,.75); font-size:.72rem; text-decoration:underline dotted; cursor:pointer; text-shadow:var(--shadow); }
    #app.cine .era, #app.cine .source, #app.cine .prompt, #app.cine .chapter { opacity:0; pointer-events:none; }
    .prompt { position:absolute; z-index:5; transform:translate(-50%, -100%); display:flex; align-items:center; gap:8px; color:var(--ink); text-shadow:var(--shadow); font-size:.95rem; white-space:nowrap; pointer-events:none; }
    .prompt .key { display:inline-grid; place-items:center; min-width:26px; height:26px; padding:0 6px; border-radius:6px; border:1.5px solid rgba(255,246,234,.85); font-weight:700; font-size:.82rem; box-shadow:0 0 12px rgba(255,210,122,.35); }
    .prompt .name { color:var(--dim); font-size:.82rem; }
    .prompt .ring { width:70px; height:4px; border-radius:2px; background:rgba(255,246,234,.25); overflow:hidden; } .prompt .fill { display:block; height:100%; width:0; background:var(--gold); }
    .subs { position:absolute; z-index:7; left:0; right:0; bottom:0; padding:60px 8vw max(28px, env(safe-area-inset-bottom)); text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; background:linear-gradient(180deg, rgba(10,6,20,0) 0%, rgba(10,6,20,.45) 60%, rgba(10,6,20,.6) 100%); }
    .subs.on { opacity:1; }
    .subs .who { font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; text-shadow:var(--shadow); min-height:1em; }
    .subs[data-who="june"] .who { color:#9ff0d8; } .subs[data-who="theo"] .who { color:#9fd6ff; } .subs[data-who="elena"] .who { color:#ffd27a; } .subs[data-who="mara"] .who { color:#ffc0a8; } .subs[data-who="iris"] .who { color:#ffb0c8; }
    .subs .line { font-size:1.25rem; line-height:1.55; max-width:880px; margin:0 auto; text-shadow:var(--shadow); }
    .subs.large .line { font-size:1.6rem; }
    .subs .next { margin-top:10px; font-size:.72rem; color:var(--dim); min-height:1em; }
    .choices { position:absolute; z-index:8; left:50%; bottom:22%; transform:translateX(-50%); display:flex; flex-direction:column; gap:10px; align-items:center; }
    .choices .ctitle { font-size:.8rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); text-shadow:var(--shadow); }
    .copt { background:transparent; border:0; border-bottom:1px solid rgba(255,210,122,.45); color:var(--ink); font-size:1.15rem; padding:6px 14px; cursor:pointer; text-shadow:var(--shadow); }
    .copt:hover, .copt:focus-visible { color:var(--gold); }
    .tip { position:absolute; z-index:5; left:50%; bottom:max(26px, env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:.88rem; color:var(--dim); text-shadow:var(--shadow); opacity:0; transition:opacity .5s; pointer-events:none; }
    .tip.on { opacity:1; }
    .banner { position:absolute; z-index:5; left:50%; top:20%; transform:translateX(-50%); font-size:1.6rem; letter-spacing:.25em; font-weight:300; opacity:0; transition:opacity .5s; text-shadow:var(--shadow); pointer-events:none; white-space:nowrap; }
    .banner.on { opacity:.95; }
    .aimframe { position:absolute; z-index:4; inset:9% 14%; border:2px solid rgba(255,246,234,.55); border-radius:6px; pointer-events:none; box-shadow:0 0 0 9999px rgba(0,0,0,.18); }
    .aimframe::after { content:''; position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px; border:1.5px solid rgba(255,246,234,.7); border-radius:50%; }
    #app.cue .subs, #app.cue .vignette { box-shadow:inset 0 -60px 80px -40px rgba(255,210,122,.35); }
    .fade { position:absolute; z-index:9; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .35s; } .fade.on { opacity:1; } .fade.white { background:#fff; }
    .saved { position:absolute; z-index:6; bottom:16px; right:20px; font-size:.72rem; color:var(--dim); opacity:0; transition:opacity .4s; text-shadow:var(--shadow); } .saved.on { opacity:1; }

    .panel { position:absolute; z-index:11; left:50%; top:50%; transform:translate(-50%, -50%); width:min(640px, 94vw); max-height:88vh; overflow:auto; padding:22px 26px; background:rgba(14,12,26,.86); backdrop-filter:blur(8px); border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    .panel h2 { margin:0 0 12px; font-size:1rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:600; }
    .menu { display:grid; gap:4px; } .mbtn { text-align:left; background:transparent; color:var(--ink); border:0; border-bottom:1px solid rgba(255,255,255,.08); padding:11px 2px; font-size:1rem; cursor:pointer; } .mbtn:hover { color:var(--gold); }
    .srow { display:flex; gap:12px; align-items:center; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.06); flex-wrap:wrap; } .srow .sl { width:110px; color:var(--dim); font-size:.9rem; } .srow .sv { display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex:1; }
    .sbtn, .kbtn { background:transparent; color:var(--ink); border:1px solid rgba(255,246,234,.3); border-radius:14px; padding:4px 12px; cursor:pointer; font-size:.85rem; } .sbtn:hover, .kbtn:hover { border-color:var(--gold); }
    .keys { display:flex; gap:6px; flex-wrap:wrap; } input[type=range] { accent-color:#ffd27a; width:180px; }
    table.prov { width:100%; border-collapse:collapse; font-size:.82rem; } table.prov th { text-align:left; color:var(--dim); font-weight:400; padding:4px 8px 4px 0; vertical-align:top; width:90px; } table.prov td { font-family:var(--mono); color:#bfe8ff; word-break:break-all; padding:4px 0; }
    .lbl { margin-top:10px; font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); } .copies { margin:6px 0; padding-left:18px; font-size:.88rem; } .dim { color:var(--dim); font-size:.85rem; }

    .overlay { position:absolute; z-index:10; inset:0; display:grid; place-items:center; text-align:center; padding:24px; }
    .overlay.title { background:linear-gradient(180deg, rgba(10,6,20,.05) 0%, rgba(10,6,20,.45) 60%, rgba(10,6,20,.85) 100%); align-content:end; padding-bottom:9vh; }
    .titlebox h1 { font-size:clamp(34px, 5.4vw, 64px); margin:0; font-weight:700; letter-spacing:.04em; text-shadow:0 4px 24px rgba(255,150,100,.45), 0 2px 4px rgba(0,0,0,.6); }
    .titlebox .sub { color:var(--gold); font-size:clamp(15px, 2vw, 22px); letter-spacing:.14em; margin-top:6px; } .titlebox .tag { color:var(--dim); margin:14px 0 24px; }
    .titlebox .note { margin-top:10px; font-size:12px; color:var(--dim); }
    .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn { background:rgba(255,246,234,.08); color:var(--ink); border:1px solid rgba(255,246,234,.45); border-radius:24px; padding:11px 26px; font-size:1rem; cursor:pointer; } .btn.primary { background:rgba(255,210,122,.2); border-color:var(--gold); } .btn:hover { background:rgba(255,210,122,.3); } .btn.ghost { border-color:transparent; background:transparent; color:var(--dim); }
    .langbtn { position:absolute; top:16px; right:18px; }
    .overlay.card { background:rgba(6,4,12,.82); } .cardbox .a { font-size:clamp(26px, 4vw, 44px); letter-spacing:.12em; } .cardbox .b { margin-top:10px; color:var(--dim); font-size:.9rem; }
    .overlay.rebuild { background:#06080e; font-family:var(--mono); } .overlay.rebuild .big { color:#7dffd8; } .overlay.rebuild .small { color:var(--dim); font-family:var(--font); font-size:.85rem; }
    .feed { text-align:left; font-size:clamp(10px, 1.2vw, 13px); color:#bfe8ff; line-height:1.7; white-space:pre; overflow:hidden; max-width:94vw; min-height:12em; }
    .overlay.letterbg { background:rgba(10,8,14,.88); cursor:pointer; } .letter { max-width:620px; text-align:left; background:#f6efe0; color:#2a2026; padding:28px 32px; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,.6); transform:rotate(-0.6deg); }
    .letter .lt { font-size:.75rem; letter-spacing:.16em; text-transform:uppercase; color:#8a4a3a; margin-bottom:12px; } .letter pre { white-space:pre-wrap; font-family:Georgia, "Noto Serif CJK SC", serif; font-size:1.05rem; line-height:1.7; margin:0; }
    .overlay.credits { background:linear-gradient(180deg, rgba(8,10,20,.35), rgba(8,10,20,.85)); overflow:auto; align-content:start; padding-top:8vh; }
    .roll { max-width:760px; } .roll .end { font-size:2.4rem; letter-spacing:.3em; margin-bottom:18px; } .roll .h { color:var(--gold); letter-spacing:.14em; margin-top:10px; } .roll .role { font-size:1.4rem; margin:8px 0; text-shadow:var(--shadow); }
    .roll .mara { margin-top:16px; color:#bfe8ff; } .roll .small { font-size:.8rem; color:var(--dim); margin:4px 0; } .roll .h2 { margin-top:26px; letter-spacing:.14em; color:var(--gold); font-size:.85rem; text-transform:uppercase; }
    .album { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:12px 0; } .album figure { margin:0; width:200px; background:#fbf6ea; padding:8px 8px 12px; color:#3a2a2a; transform:rotate(-1.5deg); box-shadow:0 8px 24px rgba(0,0,0,.4); } .album figure:nth-child(2n) { transform:rotate(1.8deg); }
    .album img, .album .noimg { width:100%; height:124px; object-fit:cover; display:block; background:#c8d8e8; } .album figcaption { font-size:.75rem; margin-top:6px; line-height:1.4; }
    .roll .unsent { margin-top:22px; font-style:italic; color:var(--ink); }
    .err, .loading { max-width:560px; line-height:1.6; }
    @media (max-width:640px) { .subs .line { font-size:1.05rem; } .banner { font-size:1.1rem; } }
    html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { animation:none !important; transition-duration:.01s !important; }
  </style>
</head>
<body>
  <div id="app"><div id="stage"></div><div class="vignette"></div></div>
  <script type="module" src="/v5/main.js"></script>
</body>
</html>
