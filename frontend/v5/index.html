  <style>
    :root { --ink:#fff6ea; --dim:rgba(255,246,234,.7); --gold:#ffd27a; --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; --mono:"Courier New", "Noto Sans Mono CJK SC", monospace;

    .reticle.on { transform:scale(1.6); border-color:var(--gold); }
    /* the pointer is captured while exploring: a small dot shows where you look (hidden in cut-scenes and the seated scenes that have their own frame) */

    #app.locked .lookdot { display:block; } #app.locked.cine .lookdot, #app.locked.noDot .lookdot { display:none; }

    #app.cine .act { opacity:0; }
    .overlay.credits { overflow-y:auto; place-items:start center; } .overlay.credits .roll { max-width:920px; padding-bottom:40px; }
    .touchui { position:absolute; z-index:8; right:max(18px, env(safe-area-inset-right)); bottom:max(110px, calc(env(safe-area-inset-bottom) + 96px)); width:142px; height:64px; }

    #app.cine .touchui .tb-jump { opacity:.3; }

    .chapter.on { opacity:.95; }
    .era { position:absolute; z-index:6; top:max(16px, env(safe-area-inset-top)); right:max(18px, env(safe-area-inset-right)); background:transparent; border:0; color:var(--dim); font-size:.78rem; letter-spacing:.08em; text-shadow:var(--shadow); cursor:pointer; }

    .subs { position:absolute; z-index:7; left:0; right:0; bottom:0; padding:60px 8vw max(28px, env(safe-area-inset-bottom)); text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; background:linear-gradient(180deg, rgba(10,6,20,0) 0%, rgba(10,6,20,.45) 60%, rgba(10,6,20,.6) 100%); }

    .banner.on { opacity:.95; }
    .aimframe { position:absolute; z-index:4; inset:10% 10%; border:2px solid rgba(255,246,234,.55); border-radius:6px; pointer-events:none; box-shadow:0 0 0 9999px rgba(0,0,0,.18); }
    /* RC3: the frame is the middle 80% of the view, exactly what counts (core/game.js FRAME_BOX) */
    .aimframe.ready { border-color:var(--gold); box-shadow:0 0 0 9999px rgba(0,0,0,.12), inset 0 0 24px rgba(255,210,122,.35); }
    .aimframe .aimnote { position:absolute; left:0; right:0; bottom:10px; text-align:center; font-size:.9rem; color:var(--ink); text-shadow:var(--shadow); letter-spacing:.04em; }
    .aimframe.ready .aimnote { color:var(--gold); }
    .aimframe.left::before, .aimframe.right::before { content:'‹'; position:absolute; top:50%; left:14px; margin-top:-28px; font-size:44px; line-height:56px; color:rgba(255,246,234,.85); text-shadow:var(--shadow); animation:aimnudge 1.1s ease-in-out infinite; }
    .aimframe.right::before { content:'›'; left:auto; right:14px; }

    .menu { display:grid; gap:4px; } .mbtn { text-align:left; background:transparent; color:var(--ink); border:0; border-bottom:1px solid rgba(255,255,255,.08); padding:11px 2px; font-size:1rem; cursor:pointer; } .mbtn:hover { color:var(--gold); }
    .srow { display:flex; gap:12px; align-items:center; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.06); flex-wrap:wrap; } .srow .sl { width:110px; color:var(--dim); font-size:.9rem; } .srow .sv { display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex:1; }

    .keys { display:flex; gap:6px; flex-wrap:wrap; } input[type=range] { accent-color:#ffd27a; width:180px; }
    table.prov { width:100%; border-collapse:collapse; font-size:.82rem; } table.prov th { text-align:left; color:var(--dim); font-weight:400; padding:4px 8px 4px 0; vertical-align:top; width:90px; } table.prov td { font-family:var(--mono); color:#bfe8ff; word-break:break-all; padding:4px 0; }

    .overlay.title { background:linear-gradient(180deg, rgba(10,6,20,.05) 0%, rgba(10,6,20,.45) 60%, rgba(10,6,20,.85) 100%); align-content:end; padding-bottom:9vh; }
    .titlebox h1 { font-size:clamp(34px, 5.4vw, 64px); margin:0; font-weight:700; letter-spacing:.04em; text-shadow:0 4px 24px rgba(255,150,100,.45), 0 2px 4px rgba(0,0,0,.6); }
    .titlebox .sub { color:var(--gold); font-size:clamp(15px, 2vw, 22px); letter-spacing:.14em; margin-top:6px; } .titlebox .tag { color:var(--dim); margin:14px 0 24px; }

    .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

    .langbtn { position:absolute; top:16px; right:18px; }
    .overlay.card { background:rgba(6,4,12,.82); } .cardbox .a { font-size:clamp(26px, 4vw, 44px); letter-spacing:.12em; } .cardbox .b { margin-top:10px; color:var(--dim); font-size:.9rem; }
    .overlay.rebuild { background:#06080e; font-family:var(--mono); } .overlay.rebuild .big { color:#7dffd8; } .overlay.rebuild .small { color:var(--dim); font-family:var(--font); font-size:.85rem; }
