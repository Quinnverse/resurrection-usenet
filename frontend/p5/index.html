<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resurrection — The Summer We Never Finished</title>
  <style>
    :root { --ink:#fff6ea; --dim:rgba(255,246,234,.72); --gold:#ffd27a; --rose:#ff9ac0; --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; --mono:"Courier New", "Noto Sans Mono CJK SC", monospace;
      --shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.55), 0 2px 18px rgba(20,10,30,.45); }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:#0b0812; color:var(--ink); font-family:var(--font); overflow:hidden; }
    html.large-text { font-size:118%; }
    #app { position:fixed; inset:0; }
    #stage, #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
    #stage canvas { touch-action:none; cursor:grab; }
    .vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 58%, rgba(10,6,20,.5) 100%); }
    button { font-family:var(--font); }
    button:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }

    /* ---- narrative HUD: no panel, no box; text over the world ---- */
    .hud { position:absolute; z-index:6; top:max(18px, env(safe-area-inset-top)); left:max(22px, env(safe-area-inset-left)); max-width:min(520px, 70vw); pointer-events:none; transition:opacity .6s ease, transform .6s ease; text-shadow:var(--shadow); background:transparent; }
    .hud .chap { font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); opacity:.9; margin-bottom:4px; }
    .hud .obj { pointer-events:auto; display:block; background:transparent; border:0; padding:0; margin:0; text-align:left; color:var(--ink); font-size:1.18rem; line-height:1.35; font-weight:600; cursor:pointer; text-shadow:var(--shadow); }
    .hud .obj .objText { border-bottom:1px dashed rgba(255,246,234,.0); transition:border-color .3s; }
    .hud .obj:hover .objText, .hud .obj:focus-visible .objText { border-bottom-color:rgba(255,210,122,.7); }
    .hud .obj.lit .objText::before { content:'\2726  '; color:var(--gold); }
    .hud .hintline { margin-top:5px; font-size:.9rem; font-style:italic; color:var(--dim); line-height:1.4; }
    .hud.new .obj { animation:newobj 2.2s ease; }
    @keyframes newobj { 0% { opacity:0; transform:translateY(-6px); } 15% { opacity:1; transform:none; color:var(--gold); } 100% { color:var(--ink); } }
    #app.cine .hud, #app.cine .corner, #app.cine .tip { opacity:0; pointer-events:none; }
    #app.cine .hud .obj { pointer-events:none; }

    .corner { position:absolute; z-index:6; top:max(16px, env(safe-area-inset-top)); right:max(18px, env(safe-area-inset-right)); display:flex; gap:14px; align-items:center; transition:opacity .6s; }
    .cbtn { background:transparent; border:0; color:var(--dim); font-size:.85rem; cursor:pointer; text-shadow:var(--shadow); padding:4px 2px; }
    .cbtn:hover { color:var(--ink); }
    .cbtn.b98 { color:#ffe2a8; }
    .saved { position:absolute; z-index:6; bottom:18px; right:22px; font-size:.75rem; color:var(--dim); opacity:0; transition:opacity .4s; text-shadow:var(--shadow); }
    .saved.on { opacity:1; }

    /* ---- prompt near the thing you can use ---- */
    .prompt { position:absolute; z-index:5; transform:translate(-50%, -100%); display:flex; align-items:center; gap:8px; background:transparent; border:0; color:var(--ink); text-shadow:var(--shadow); font-size:.95rem; white-space:nowrap; cursor:pointer; padding:4px; }
    .prompt .key { display:inline-grid; place-items:center; min-width:26px; height:26px; padding:0 6px; border-radius:6px; border:1.5px solid rgba(255,246,234,.85); font-weight:700; font-size:.85rem; box-shadow:0 0 12px rgba(255,210,122,.35); }
    .prompt .name { color:var(--dim); font-size:.85rem; }
    .prompt.compact .verb { display:none; }
    .prompt .ring { width:70px; height:4px; border-radius:2px; background:rgba(255,246,234,.25); overflow:hidden; }
    .prompt .ringfill { display:block; height:100%; width:0; background:var(--gold); }

    /* ---- subtitles ---- */
    .caption { position:absolute; z-index:5; left:50%; bottom:max(92px, calc(env(safe-area-inset-bottom) + 92px)); transform:translateX(-50%); width:min(780px, 92vw); text-align:center; font-size:1.12rem; line-height:1.5; text-shadow:var(--shadow); pointer-events:none; transition:opacity .4s; opacity:0; }
    .caption .who { display:block; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:2px; }
    .dialog { position:absolute; z-index:7; left:0; right:0; bottom:0; padding:56px 8vw max(30px, env(safe-area-inset-bottom)); background:linear-gradient(180deg, rgba(10,6,20,0) 0%, rgba(10,6,20,.62) 55%, rgba(10,6,20,.8) 100%); text-align:center; cursor:pointer; }
    .dialog .who { font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; text-shadow:var(--shadow); }
    .dialog[data-who="theo"] .who { color:#9fd6ff; } .dialog[data-who="screen"] .who { color:#7dffd8; }
    .dialog[data-who="screen"] .say { font-family:var(--mono); }
    .dialog .say { font-size:1.25rem; line-height:1.55; max-width:860px; margin:0 auto; min-height:2.6em; text-shadow:var(--shadow); }
    .dialog .next { margin-top:10px; font-size:.75rem; color:var(--dim); }
    .dialog .skip { position:absolute; right:max(22px, env(safe-area-inset-right)); bottom:max(26px, env(safe-area-inset-bottom)); background:transparent; border:0; color:var(--dim); font-size:.85rem; cursor:pointer; }
    .tip { position:absolute; z-index:5; left:50%; bottom:max(26px, env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:.92rem; color:var(--ink); text-shadow:var(--shadow); pointer-events:none; text-align:center; max-width:90vw; transition:opacity .4s; }
    .tip span { display:inline-block; animation:tipIn .5s ease; border-bottom:1px solid rgba(255,210,122,.6); padding-bottom:2px; }
    @keyframes tipIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .banner { position:absolute; z-index:5; left:50%; top:22%; transform:translateX(-50%); font-size:2rem; letter-spacing:.3em; font-weight:300; opacity:0; transition:opacity .5s; text-shadow:var(--shadow); pointer-events:none; }
    .banner.on { opacity:.95; }
    .fade { position:absolute; z-index:8; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .6s ease; }
    .fade.on { opacity:1; }
    #app.switching #stage { filter:brightness(1.6) saturate(.4) blur(2px); transition:filter .2s; }
    #stage { transition:filter .35s; }

    /* ---- archive reader and menu ---- */
    .panel { position:absolute; z-index:9; left:50%; top:50%; transform:translate(-50%, -50%); width:min(720px, 94vw); max-height:88vh; overflow:auto; padding:22px 26px 18px; color:var(--ink); background:rgba(14,12,26,.82); backdrop-filter:blur(8px); border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    .panel .ph { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
    .panel h2 { margin:0; font-size:1rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:600; }
    .panel h3 { margin:6px 0 4px; font-size:1.25rem; }
    .pclose, .techbtn { background:transparent; border:0; color:var(--dim); cursor:pointer; font-size:.85rem; padding:4px; }
    .pclose:hover, .techbtn:hover { color:var(--ink); }
    .tabs { display:flex; gap:16px; margin:12px 0 10px; border-bottom:1px solid rgba(255,255,255,.12); }
    .tab { background:transparent; border:0; color:var(--dim); padding:6px 0; cursor:pointer; font-size:.92rem; border-bottom:2px solid transparent; }
    .tab.on { color:var(--ink); border-bottom-color:var(--gold); }
    .sources { display:grid; gap:6px; margin:8px 0 12px; }
    .src { display:flex; align-items:center; gap:10px; font-size:.92rem; color:var(--dim); }
    .src.on { color:var(--ink); }
    .src .dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.25); flex:none; }
    .src.on .dot { background:#7dffd8; box-shadow:0 0 8px #7dffd8; }
    .src .sstate { font-size:.8rem; color:var(--dim); }
    .sbtn { margin-left:auto; background:transparent; color:var(--gold); border:1px solid rgba(255,210,122,.7); border-radius:16px; padding:5px 14px; cursor:pointer; font-size:.85rem; }
    .sbtn:hover { background:rgba(255,210,122,.12); }
    .from { color:var(--dim); margin:0 0 10px; font-size:.92rem; }
    .label { font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:10px 0 6px; }
    .copies { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
    .copy { display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; font-size:.95rem; }
    .copy.off { opacity:.5; }
    .copy .cv { font-size:.85rem; }
    .copy.ok .cv { color:#7dffd8; } .copy.truncated .cv, .copy.corrupt .cv { color:#ffb070; } .copy.stripped .cv { color:#ff9ac0; } .copy.none .cv { color:var(--dim); }
    .copy .bar { grid-column:1 / -1; height:4px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden; }
    .copy .bar .fill { display:block; height:100%; background:currentColor; }
    .copy.ok .bar { color:#7dffd8; } .copy.truncated .bar { color:#ffb070; }
    .result { margin:14px 0 6px; font-weight:600; } .result.good { color:#7dffd8; } .result.bad { color:#ffb070; }
    .tech { display:block; white-space:pre-wrap; font-family:var(--mono); font-size:.78rem; color:#bfe8ff; background:rgba(0,0,0,.3); border-radius:6px; padding:8px 10px; margin-top:4px; grid-column:1 / -1; word-break:break-all; }
    .buildbox { margin:10px 0; padding-left:12px; border-left:2px solid rgba(255,210,122,.5); font-size:.95rem; display:grid; gap:3px; }
    .buildbox .bt { font-weight:600; }
    .dim { color:var(--dim); font-size:.88rem; }
    .note { margin-top:14px; }
    .menu { display:grid; gap:8px; margin-top:14px; }
    .mbtn { text-align:left; background:transparent; color:var(--ink); border:0; border-bottom:1px solid rgba(255,255,255,.08); padding:10px 2px; font-size:1rem; cursor:pointer; }
    .mbtn:hover { color:var(--gold); }
    .vol { display:flex; align-items:center; gap:12px; padding:6px 2px; } .vol input { flex:1; accent-color:#ffd27a; }
    .controls { margin-top:14px; line-height:1.6; }

    /* ---- full-screen moments ---- */
    .overlay { position:absolute; z-index:10; inset:0; display:grid; place-items:center; text-align:center; padding:24px; }
    .overlay.title { background:linear-gradient(180deg, rgba(10,6,20,.05) 0%, rgba(10,6,20,.45) 60%, rgba(10,6,20,.85) 100%); align-content:end; padding-bottom:10vh; }
    .titlebox h1 { font-size:clamp(32px, 5vw, 60px); margin:0; font-weight:700; letter-spacing:.04em; text-shadow:0 4px 24px rgba(255,150,100,.45), 0 2px 4px rgba(0,0,0,.6); }
    .titlebox .sub { color:var(--gold); font-size:clamp(15px, 2vw, 22px); letter-spacing:.14em; margin-top:6px; }
    .titlebox .tag { color:var(--dim); margin:14px 0 24px; font-size:clamp(14px, 1.6vw, 17px); }
    .titlebox .note { margin-top:14px; font-size:12px; color:var(--dim); }
    .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn { background:rgba(255,246,234,.08); color:var(--ink); border:1px solid rgba(255,246,234,.45); border-radius:24px; padding:11px 26px; font-size:1rem; cursor:pointer; }
    .btn.primary { background:rgba(255,210,122,.2); border-color:var(--gold); }
    .btn:hover { background:rgba(255,210,122,.3); }
    .btn.ghost { border-color:transparent; background:transparent; color:var(--dim); }
    .tl { position:absolute; top:16px; right:18px; }
    .overlay.intro { background:#07050d; }
    .overlay.intro p { font-size:clamp(18px, 2.6vw, 28px); line-height:1.6; margin:0; opacity:0; transition:opacity 1.2s ease; max-width:80vw; }
    .overlay.intro p.on { opacity:1; }
    .skipintro { position:absolute; right:24px; bottom:24px; }
    .overlay.rebuild { background:#06080e; font-family:var(--mono); }
    .overlay.rebuild .big { font-size:clamp(15px, 2vw, 20px); color:#7dffd8; }
    .overlay.rebuild .small { color:var(--dim); font-family:var(--font); }
    .feed { text-align:left; font-size:clamp(11px, 1.3vw, 14px); color:#bfe8ff; line-height:1.7; min-height:10em; white-space:pre; overflow:hidden; max-width:92vw; }
    .overlay.ending { background:radial-gradient(ellipse at 50% 55%, rgba(10,6,20,.15), rgba(10,6,20,.7)); }
    .endcard .a { letter-spacing:.3em; text-transform:uppercase; font-size:.85rem; color:var(--dim); }
    .endcard .b { font-size:clamp(26px, 4vw, 44px); margin:10px 0 6px; text-shadow:var(--shadow); }
    .endcard .c { color:var(--gold); margin-bottom:26px; text-shadow:var(--shadow); }
    .err, .loading { max-width:560px; line-height:1.6; }

    /* ---- touch ---- */
    .touch { position:absolute; z-index:5; inset:auto 0 0 0; height:42vh; pointer-events:none; }
    .stick { position:absolute; left:max(26px, env(safe-area-inset-left)); bottom:max(26px, env(safe-area-inset-bottom)); width:132px; height:132px; border-radius:50%; border:2px solid rgba(255,246,234,.35); pointer-events:auto; touch-action:none; }
    .stick .nub { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px; border-radius:50%; background:rgba(255,246,234,.45); }
    .use { position:absolute; right:max(26px, env(safe-area-inset-right)); bottom:max(40px, env(safe-area-inset-bottom)); width:84px; height:84px; border-radius:50%; font-size:30px; background:rgba(255,246,234,.18); border:2px solid rgba(255,246,234,.55); color:#fff; pointer-events:auto; touch-action:none; }
    @media (max-width:640px) { .hud { max-width:64vw; } .hud .obj { font-size:1rem; } .hud .hintline { font-size:.8rem; } .corner { flex-direction:column; align-items:flex-end; gap:4px; } .caption { bottom:190px; font-size:1rem; } .dialog .say { font-size:1.05rem; } }
    html.reduce-motion *, html.reduce-motion *::before { animation:none !important; transition-duration:.01s !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <div class="vignette"></div>
  </div>
  <script type="module" src="/p5/js/main.js"></script>
</body>
</html>
