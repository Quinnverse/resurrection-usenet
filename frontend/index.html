<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RESURRECTION — She died in 1998. Her last message arrived tonight. A browser-based narrative investigation.">
  <title>RESURRECTION — The Internet Remembers the Dead</title>
  <style>
    :root {
      --charcoal: #17191d;
      --ink: #0f1a26;
      --panel: #1c2430;
      --line: #33404f;
      --parchment: #efe6d2;
      --muted: #a9a79c;
      --amber: #d9a441;
      --red: #c0584a;
      --focus: #f2c46d;
      --serif: Georgia, 'Times New Roman', serif;
      --mono: 'Courier New', Courier, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--charcoal); color: var(--parchment); }
    body { font-family: var(--serif); font-size: 17px; line-height: 1.6; background: radial-gradient(ellipse at top, #1f2a38 0%, var(--charcoal) 60%); }
    h1, h2, h3 { font-weight: normal; margin: 0 0 0.5rem; }
    p { margin: 0 0 0.9rem; }
    button { font: inherit; cursor: pointer; border-radius: 2px; padding: 0.6rem 1.1rem; border: 1px solid var(--line); background: transparent; color: var(--parchment); }
    button:disabled { opacity: 0.5; cursor: wait; }
    button:focus-visible, a:focus-visible, summary:focus-visible, .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    button.primary { background: var(--amber); color: var(--ink); border-color: var(--amber); font-weight: bold; }
    button.action { border-color: var(--amber); color: var(--amber); }
    button.quiet { border-color: transparent; color: var(--muted); text-decoration: underline; padding: 0.3rem 0.4rem; }
    button.danger { border-color: var(--red); color: var(--parchment); background: rgba(192, 88, 74, 0.25); }
    .kicker { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); margin: 0 0 0.4rem; }
    .muted { color: var(--muted); }
    .warning { color: var(--red); }
    .warn { background: rgba(192, 88, 74, 0.14); }
    .warn-text { color: #e4a093; font-size: 0.95rem; }
    .title { font-size: clamp(2.2rem, 6vw, 3.6rem); letter-spacing: 0.12em; }
    .tagline { font-style: italic; font-size: 1.25rem; color: var(--amber); }
    .lede { font-size: 1.05rem; max-width: 60ch; }
    .note { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-top: 1.2rem; }

    .screen { max-width: 760px; margin: 0 auto; padding: 4rem 1.25rem; }
    .screen.center { text-align: center; }
    .screen.landing { padding-top: 10vh; }

    .workspace { max-width: 1280px; margin: 0 auto; padding: 0 1rem 3rem; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.9rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .bar-right { display: flex; align-items: center; gap: 0.8rem; }
    .stage { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
    .next { display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center; padding: 1rem 0; }
    .notice { font-family: var(--mono); font-size: 0.9rem; color: var(--amber); border-left: 2px solid var(--amber); padding-left: 0.7rem; }
    .confirm { border: 1px solid var(--red); padding: 0.9rem; margin: 0.8rem 0; background: rgba(192, 88, 74, 0.08); }

    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.4rem; align-items: start; }
    .reader { min-width: 0; }
    .side { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    .panel { border: 1px solid var(--line); background: var(--panel); padding: 0.9rem 1rem; }
    .panel h3 { font-size: 1.05rem; }
    .panel summary { cursor: pointer; font-family: var(--mono); font-size: 0.85rem; }

    .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .tab { font-family: var(--mono); font-size: 0.8rem; padding: 0.35rem 0.6rem; color: var(--muted); }
    .tab.active { color: var(--ink); background: var(--parchment); border-color: var(--parchment); }

    .record { background: var(--ink); border: 1px solid var(--line); padding: 1.2rem 1.3rem; margin-bottom: 1.2rem; }
    .record-title { font-size: 1.45rem; color: var(--parchment); }
    .headers { display: grid; grid-template-columns: max-content 1fr; gap: 0.15rem 0.9rem; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin: 0 0 1rem; overflow-wrap: anywhere; }
    .headers dt { color: var(--amber); }
    .headers dd { margin: 0; }
    .body { font-size: 1.12rem; white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px dashed var(--line); padding-top: 0.9rem; margin: 0; }

    table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.8rem; }
    th, td { text-align: left; padding: 0.3rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
    th { color: var(--amber); font-weight: normal; }

    .decision-group { margin-bottom: 0.9rem; }
    .choice { display: flex; justify-content: space-between; gap: 0.8rem; align-items: center; flex-wrap: wrap; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
    .preview { border-top: 1px solid var(--amber); padding-top: 0.7rem; margin-top: 0.7rem; }
    .preview ul, .result ul, .journal, .nodes, .panel ul { padding-left: 1.1rem; margin: 0.4rem 0; font-size: 0.92rem; }
    .result { margin-top: 1.2rem; }
    .reaction { border-left: 2px solid var(--amber); margin: 0.6rem 0; padding: 0.2rem 0 0.2rem 0.8rem; font-style: italic; }
    .reaction strong { font-style: normal; color: var(--amber); font-family: var(--mono); font-size: 0.8rem; }
    .panel .nodes li, .journal li { margin-bottom: 0.35rem; }
    .letter { border-left: 2px solid var(--amber); padding-left: 1rem; margin: 1.2rem 0; font-size: 1.1rem; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      body { font-size: 16px; }
    }
    @media (max-width: 480px) {
      .workspace, .screen { padding-left: 0.7rem; padding-right: 0.7rem; }
      .headers { grid-template-columns: 1fr; }
      .headers dt { margin-top: 0.4rem; }
      button { padding: 0.7rem 0.9rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>RESURRECTION needs JavaScript enabled to run the archive.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
