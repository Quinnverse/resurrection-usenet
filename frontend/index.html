<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resurrection — The Internet Remembers the Dead</title>
  <link rel="stylesheet" href="/styles/terminal.css">
  <style>
    .terminal-window { width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 1rem; background: #0a0a0a; }
    .terminal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #008800; padding-bottom: 0.5rem; margin-bottom: 1rem; }
    .terminal-title { font-weight: bold; }
    .ansi-cyan { color: #00ffff; }
    .ansi-white { color: #ffffff; }
    .ansi-gold { color: #ffcc00; }
    .ansi-green { color: #00ff00; }
    .ansi-dim { color: #008800; }
    .terminal-status { display: flex; gap: 1rem; font-size: 0.9rem; }
    .status-item { display: flex; align-items: center; gap: 0.5rem; }
    .status-indicator { width: 10px; height: 10px; background: #00ff00; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .terminal-content { display: flex; gap: 1rem; flex: 1; overflow: hidden; }
    .terminal-sidebar { width: 200px; border-right: 1px solid #008800; padding-right: 1rem; overflow-y: auto; }
    .thread-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .thread-item { padding: 0.5rem; border: 1px solid #008800; cursor: pointer; }
    .thread-item:hover { background: rgba(0, 255, 0, 0.1); }
    .terminal-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .message-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; padding: 0.5rem; }
    .message-item { border: 1px solid #008800; padding: 1rem; background: rgba(0, 0, 0, 0.3); }
    .message-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; border-bottom: 1px dashed #008800; }
    .ansi-blue { color: #00aaff; }
    .message-content { white-space: pre-wrap; line-height: 1.5; margin-bottom: 0.5rem; }
    .message-actions { display: flex; gap: 0.5rem; }
    .agent-panel { display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0; }
    .agent-card { border: 1px solid #008800; padding: 1rem; }
    .agent-name { font-weight: bold; margin-bottom: 0.5rem; }
    .memory-bar { width: 100%; height: 6px; background: #008800; margin-top: 0.5rem; }
    .memory-bar-fill { height: 100%; background: #00ff00; transition: width 0.5s; }
    .terminal-footer { border-top: 2px solid #008800; padding-top: 1rem; }
    .action-menu { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .action-btn { background: transparent; border: 1px solid #008800; color: #00ff00; padding: 0.5rem 1rem; cursor: pointer; font-family: monospace; }
    .action-btn:hover { background: rgba(0, 255, 0, 0.2); }
    .input-field { width: 100%; background: transparent; border: 1px solid #008800; color: #00ff00; padding: 0.5rem; font-family: monospace; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
