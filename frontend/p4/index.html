<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resurrection — The Internet Remembers You</title>
  <style>
    :root { --ink:#fff6ea; --dim:#d8c8e8; --panel:rgba(20,14,40,0.78); --edge:rgba(255,220,170,0.35); --gold:#ffd27a; --rose:#ff9ac0; --cyan:#8ff0ff; --font:"Avenir Next","Segoe UI","Noto Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --mono:"Courier New","Noto Sans Mono CJK SC",monospace; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { margin:0; height:100%; overflow:hidden; background:#0d0a18; color:var(--ink); font-family:var(--font); }
    #app { position:fixed; inset:0; }
    #stage { position:absolute; inset:0; }
    #stage canvas { display:block; width:100%; height:100%; touch-action:none; cursor:grab; transition:filter .6s ease; }
    #stage canvas.dragging { cursor:grabbing; }
    #stage canvas.view98 { filter:sepia(0.35) saturate(1.35) brightness(1.06) contrast(1.02); }
    #stage canvas.view04 { filter:grayscale(0.55) hue-rotate(185deg) saturate(0.7) contrast(1.08) brightness(0.92); }
    .vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(10,6,20,0.55) 100%); }
    .scan { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .6s; background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px); }
    .scan.on { opacity:1; }

    .top { z-index:6; position:absolute; top:max(12px, env(safe-area-inset-top)); left:14px; right:14px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; pointer-events:none; }
    .objective { pointer-events:none; max-width:min(440px, 62vw); background:var(--panel); border:1px solid var(--edge); border-left:4px solid var(--gold); border-radius:6px; padding:9px 14px 10px; backdrop-filter:blur(4px); box-shadow:0 6px 24px rgba(0,0,0,.35); transition:transform .35s ease, border-color .35s; }
    .objective .k { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
    .objective .v { font-size:16px; line-height:1.4; margin-top:3px; }
    .objective.flash { transform:scale(1.04); border-left-color:var(--rose); }
    .objective.flash .k { color:var(--rose); }
    .settings { pointer-events:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .btn { font:inherit; font-size:13px; color:var(--ink); background:rgba(30,22,58,0.8); border:1px solid rgba(255,220,170,.4); border-radius:6px; padding:7px 11px; cursor:pointer; min-height:36px; }
    .btn:hover,.btn:focus-visible { border-color:var(--gold); outline:none; }
    .btn.big { font-size:17px; padding:12px 26px; min-height:50px; }
    .btn.primary { background:rgba(120,60,90,0.85); border-color:var(--gold); color:#fff3d8; }
    .vol { width:80px; accent-color:var(--gold); align-self:center; }
    .saved { position:absolute; top:70px; right:18px; font-size:12px; color:var(--dim); opacity:0; transition:opacity .4s; pointer-events:none; }
    .saved.on { opacity:.8; }
    .viewing { position:absolute; top:84px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--edge); border-radius:20px; padding:6px 8px 6px 16px; display:flex; gap:10px; align-items:center; font-size:14px; }

    .prompt { position:absolute; transform:translate(-50%,-100%); pointer-events:auto; display:flex; align-items:center; gap:8px; background:rgba(255,246,230,0.95); color:#2a1a2a; border-radius:20px; padding:6px 14px 6px 6px; font-size:14px; box-shadow:0 4px 16px rgba(0,0,0,.35); white-space:nowrap; cursor:pointer; border:none; font-family:var(--font); }
    .prompt .key { display:inline-grid; place-items:center; min-width:26px; height:26px; border-radius:6px; background:#2a1a2a; color:#fff3d8; font-weight:700; font-size:13px; padding:0 6px; }
    .prompt .name { color:#7a4a5a; font-size:12px; }

    .caption { position:absolute; left:50%; bottom:max(96px, calc(env(safe-area-inset-bottom) + 96px)); transform:translateX(-50%); width:min(760px, 92vw); text-align:center; font-size:18px; line-height:1.5; text-shadow:0 2px 8px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); pointer-events:none; transition:opacity .4s; }
    .caption .who { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin-bottom:2px; }
    .caption[data-who="post"] .who, .caption[data-who="screen"] .who { color:var(--cyan); font-family:var(--mono); }
    .caption[data-who="post"] .say, .caption[data-who="screen"] .say { font-family:var(--mono); font-size:16px; }

    .dialog { position:absolute; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(820px, 94vw); background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:16px 20px 14px; backdrop-filter:blur(5px); box-shadow:0 10px 40px rgba(0,0,0,.5); cursor:pointer; }
    .dialog .who { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
    .dialog[data-who="theo"] .who { color:var(--cyan); }
    .dialog[data-who="screen"] .who, .dialog[data-who="post"] .who { color:var(--cyan); font-family:var(--mono); }
    .dialog .say { font-size:19px; line-height:1.55; margin:6px 0 8px; min-height:2.6em; }
    .dialog[data-who="screen"] .say, .dialog[data-who="post"] .say { font-family:var(--mono); font-size:17px; color:#bfffee; }
    .dialog .hint { font-size:12px; color:var(--dim); text-align:right; }

    .tutorial { position:absolute; left:50%; bottom:max(28px, env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:10px; pointer-events:none; }
    .tip { background:rgba(255,246,230,0.92); color:#2a1a2a; border-radius:22px; padding:9px 16px; font-size:14px; box-shadow:0 4px 16px rgba(0,0,0,.35); animation:tipIn .4s ease; }
    @keyframes tipIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    .overlay { z-index:4; position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
    .title { background:linear-gradient(180deg, rgba(10,6,20,0.15) 0%, rgba(10,6,20,0.55) 65%, rgba(10,6,20,0.85) 100%); align-content:end; padding-bottom:9vh; }
    .title h1 { font-size:clamp(26px, 3.6vw, 46px); max-width:92vw; margin:0 0 8px; color:#fff1d2; text-shadow:0 4px 24px rgba(255,150,100,.45), 0 2px 4px rgba(0,0,0,.6); font-weight:700; letter-spacing:.01em; }
    .title .chap { color:var(--rose); font-size:clamp(14px,1.8vw,19px); letter-spacing:.12em; text-transform:uppercase; }
    .title .tag { color:var(--ink); opacity:.92; font-size:clamp(14px,1.7vw,18px); margin:12px 0 22px; }
    .title .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .title .note { margin-top:14px; font-size:12px; color:var(--dim); }
    .intro { background:#07050d; }
    .intro p { font-size:clamp(18px, 2.6vw, 28px); line-height:1.6; margin:0; opacity:0; transition:opacity 1.2s ease; max-width:80vw; }
    .intro p.on { opacity:1; }
    .intro .skip { position:absolute; bottom:24px; right:24px; }
    .fade { z-index:5; position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .6s ease; }
    .fade.white { background:#fff4e0; }
    .fade.on { opacity:1; }
    .ending { background:rgba(6,4,14,0.62); }
    .mail { width:min(560px, 92vw); text-align:left; background:#0c1424; border:1px solid #2f4a6a; border-radius:8px; padding:18px 22px; font-family:var(--mono); color:#bfe8ff; box-shadow:0 0 60px rgba(90,180,255,.25); animation:tipIn .6s ease; }
    .mail .h { color:#8ff0ff; font-size:13px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
    .mail .l { font-size:15px; line-height:1.7; }
    .mail .b { font-size:20px; color:#fff; margin-top:14px; }
    .tbc { margin-top:28px; opacity:0; transition:opacity 1.6s; }
    .tbc.on { opacity:1; }
    .tbc .a { font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); }
    .tbc .b { font-size:clamp(22px,3vw,34px); color:#fff1d2; margin:6px 0 18px; }
    .err { max-width:560px; padding:24px; font-size:18px; line-height:1.6; }

    .touch { position:absolute; inset:auto 0 0 0; height:42vh; pointer-events:none; }
    .stick { position:absolute; left:max(26px, env(safe-area-inset-left)); bottom:max(26px, env(safe-area-inset-bottom)); width:132px; height:132px; border-radius:50%; background:rgba(255,246,230,.12); border:2px solid rgba(255,246,230,.35); pointer-events:auto; touch-action:none; }
    .stick .nub { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px; border-radius:50%; background:rgba(255,246,230,.55); }
    .use { position:absolute; right:max(26px, env(safe-area-inset-right)); bottom:max(40px, env(safe-area-inset-bottom)); width:84px; height:84px; border-radius:50%; font-size:30px; background:rgba(255,246,230,.88); color:#2a1a2a; border:none; pointer-events:auto; touch-action:none; }
    @media (max-width:640px) { .objective .v { font-size:14px; } .caption { font-size:16px; bottom:180px; } .dialog .say { font-size:17px; } .settings .btn { font-size:12px; padding:5px 8px; } .vol { display:none; } }
    .reduce-motion .objective, .reduce-motion .tip, .reduce-motion .mail { transition:none; animation:none; }
  </style>
</head>
<body>
  <main id="app">
    <div id="stage"></div>
    <div class="vignette"></div>
    <div class="scan" id="scan"></div>
    <noscript><div class="overlay"><p class="err">This chapter needs JavaScript.</p></div></noscript>
  </main>
  <script type="module" src="/p4/js/main.js"></script>
</body>
</html>
